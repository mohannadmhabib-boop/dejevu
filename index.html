<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#3f6fb5">
<title>Dejevu · اطلب من ترابيزتك</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Fredoka:wght@600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
body{max-width:560px;margin:auto;background:var(--panel);min-height:100vh}
.hero{background:var(--blue);color:#fff;padding:22px 18px 16px;text-align:center}
.hero p{margin:6px 0 0;font-size:13px;opacity:.9}
.table{display:inline-block;margin-top:10px;background:#ffffff22;border-radius:20px;padding:3px 14px;font-size:14px;font-weight:700}
.cats{display:flex;gap:6px;overflow-x:auto;padding:10px 12px;border-bottom:1px solid var(--line);scrollbar-width:none;position:sticky;top:0;background:var(--panel);z-index:2}
.cats button{flex:none;min-height:40px;padding:0 14px;background:var(--blue2);color:var(--blue);font-size:13px;border-radius:18px}
.cats button.on{background:var(--blue);color:#fff}
.wrap{padding:4px 16px 100px}
.sec{scroll-margin-top:64px}.sec h3{font-size:15px;margin:18px 0 4px;color:var(--blue)}
.bar{position:fixed;inset:auto 12px 12px;max-width:536px;margin:auto;background:var(--coffee);color:#fff;border-radius:16px;display:flex;justify-content:space-between;align-items:center;padding:0 18px;min-height:56px;font-size:16px;z-index:3;box-shadow:0 10px 30px -10px #0006}
.head{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line);font-weight:700;position:sticky;top:0;background:var(--panel);z-index:2}
.head button{background:var(--blue2);color:var(--blue);min-height:38px;padding:0 12px}
.field{margin:14px 0}.field b{display:block;font-size:14px;margin-bottom:4px}
.pm{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pm label{border:2px solid var(--line);border-radius:12px;padding:10px;text-align:center;cursor:pointer;font-weight:700;font-size:14px}
.pm input{display:none}.pm label:has(input:checked){border-color:var(--blue);background:var(--blue2)}
.paybox{background:var(--blue2);border-radius:14px;padding:12px 14px;margin:10px 0;text-align:center}
.paybox .num{font-size:22px;font-weight:800;direction:ltr;letter-spacing:1px;word-break:break-all}
.paybox button{min-height:36px;background:var(--panel);color:var(--blue);font-size:13px;margin-top:6px}
.up{border:2px dashed var(--line);border-radius:14px;padding:16px;text-align:center;cursor:pointer;display:block;font-size:14px;color:var(--mute)}
.up img{max-height:160px;border-radius:8px;display:block;margin:0 auto 6px}
.status{text-align:center;padding:26px 18px}
.big{font-size:52px;line-height:1;font-weight:800;color:var(--blue)}
.steps{display:grid;gap:10px;text-align:start;margin:18px 0}
.st{display:flex;gap:12px;align-items:center;padding:12px;border-radius:12px;background:var(--bg);color:var(--mute);font-weight:600}
.st i{width:28px;height:28px;border-radius:50%;background:var(--line);flex:none;display:grid;place-items:center;font-style:normal;font-size:14px}
.st.on{color:var(--ink);background:var(--blue2)}.st.on i{background:var(--blue);color:#fff}
.st.now i{animation:pulse 1.4s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px #3f6fb533}}
.paused{background:#fff4e0;color:#8a5a00;padding:10px 14px;font-size:14px;text-align:center;font-weight:700}
.view{display:none}.view.on{display:block}
</style>
</head>
<body>
<div class="view on" id="vMenu">
 <div class="hero"><div class="logo">Dejevu</div><p>Speciality coffee, Speciality day</p><div class="table" id="tableLbl"></div></div>
 <div id="pausedMsg" class="paused" hidden>الطلب من الموبايل متوقف مؤقتًا، اطلب من الكاشير مباشرة 🙏</div>
 <nav class="cats" id="cats"></nav>
 <div class="wrap" id="menuList"><p class="empty">بنحمّل المنيو…</p></div>
 <button class="bar" id="cartBar" hidden><span id="barCount"></span><span id="barTotal"></span></button>
</div>

<div class="view" id="vCart">
 <div class="head"><button data-go="vMenu">→ المنيو</button>طلبك</div>
 <div class="wrap" id="cartBody"></div>
</div>

<div class="view" id="vPay">
 <div class="head"><button data-go="vCart">→ رجوع</button>الدفع وتأكيد الطلب</div>
 <div class="wrap">
  <div class="row tot"><span>المطلوب دفعه</span><span id="payTotal"></span></div>
  <div class="field"><b>هتدفع بإيه؟</b>
   <div class="pm"><label><input type="radio" name="pm" value="instapay" checked>إنستاباي</label><label><input type="radio" name="pm" value="wallet">محفظة (فودافون كاش)</label></div></div>
  <div class="paybox"><div class="note" id="payHint"></div><div class="num" id="payNum"></div><button id="copyNum">نسخ</button> <span class="note" id="copied"></span></div>
  <div class="field"><b>١. حوّل المبلغ وارفع سكرين التحويل</b>
   <label class="up"><input type="file" id="shot" accept="image/*" hidden><span id="upTxt">📷 اضغط هنا لرفع السكرين</span></label></div>
  <div class="field"><b>٢. رقم موبايل عليه واتساب</b><input id="phone" inputmode="tel" placeholder="01xxxxxxxxx" dir="ltr" autocomplete="tel"><span class="note">هنبعتلك رسالة أول ما الأوردر يجهز</span></div>
  <div class="field"><b>ملاحظات (اختياري)</b><textarea id="memo" rows="2" maxlength="300" placeholder="مثلًا: سكر خفيف"></textarea></div>
  <p class="err" id="payErr"></p>
  <button class="primary" id="send">ابعت الطلب</button>
 </div>
</div>

<div class="view" id="vStatus"><div class="status" id="statusBody"></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
{
const sb=supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:false}});
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const qs=new URLSearchParams(location.search);
const TABLE=Math.max(1,Math.min(200,parseInt(qs.get("t"))||1));
$("#tableLbl").textContent="ترابيزة رقم "+TABLE.toLocaleString("ar-EG");
let curCat=0,items=[],cats=[],settings={},cart={},shotBlob=null,pollT=null;
const ls={get:k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

async function loadMenu(){
 const [m,s]=await Promise.all([sb.from("menu_items").select("id,cat,name,price,available").order("sort"),sb.from("settings").select("*").eq("id",1).single()]);
 if(m.error||s.error){$("#menuList").innerHTML=`<p class="empty">في مشكلة في التحميل، جرّب تحدّث الصفحة.</p>`;return}
 items=m.data;settings=s.data;cats=[...new Set(items.map(i=>i.cat))];
 $("#cats").innerHTML=cats.map((c,i)=>`<button data-c="${i}" class="${i?"":"on"}"><bdi>${esc(c)}</bdi></button>`).join("");
 for(const id in cart)if(!items.find(i=>i.id==id&&i.available))delete cart[id];
 renderMenu();
}
const byId=id=>items.find(i=>i.id==id);
const cartTotal=()=>Object.entries(cart).reduce((a,[id,q])=>a+(byId(id)?.price||0)*q,0);
const qtyCtl=id=>{const q=cart[id]||0;return q?`<div class="qty"><button class="m" data-d="${id}" aria-label="أقل">−</button><span>${q}</span><button data-a="${id}" aria-label="زيادة">+</button></div>`:`<div class="qty"><button data-a="${id}" aria-label="إضافة">+</button></div>`};
function renderMenu(){
 $("#pausedMsg").hidden=!settings.paused;
 $$("#cats button").forEach((b,i)=>b.classList.toggle("on",i==curCat));
 const c=cats[curCat];
 $("#menuList").innerHTML=c?`<div class="sec"><h3><bdi>${esc(c)}</bdi></h3>${items.filter(i=>i.cat==c).map(i=>`<div class="it ${i.available?"":"off"}"><span class="n">${esc(i.name)}</span><span class="p">${egp(i.price)}</span>${!i.available||settings.paused?"":qtyCtl(i.id)}</div>`).join("")}</div>`:"";
 const n=Object.values(cart).reduce((a,b)=>a+b,0);$("#cartBar").hidden=!n;
 $("#barCount").textContent=`عرض الطلب (${n.toLocaleString("ar-EG")})`;$("#barTotal").textContent=egp(cartTotal());
}
$("#cats").onclick=e=>{const b=e.target.closest("button");if(!b)return;curCat=+b.dataset.c;renderMenu();b.scrollIntoView({behavior:"smooth",inline:"center",block:"nearest"});scrollTo({top:0,behavior:"smooth"})};
function renderCart(){
 const ent=Object.entries(cart);
 $("#cartBody").innerHTML=ent.length?ent.map(([id,q])=>`<div class="it"><span class="n">${esc(byId(id).name)}</span><span class="p">${egp(byId(id).price*q)}</span>${qtyCtl(id)}</div>`).join("")+`<div class="row tot"><span>الإجمالي</span><span>${egp(cartTotal())}</span></div><p class="note">الطلب هيتسجل على ترابيزة ${TABLE.toLocaleString("ar-EG")}</p><button class="primary" id="toPay">كمّل للدفع</button>`:`<p class="empty" style="margin-top:30px">السلة فاضية</p><button class="primary" data-go="vMenu">ارجع للمنيو</button>`;
}
function change(id,d){cart[id]=(cart[id]||0)+d;if(cart[id]<=0)delete cart[id];if(cart[id]>20)cart[id]=20;renderMenu();renderCart()}
function go(v){$$(".view").forEach(x=>x.classList.toggle("on",x.id==v));scrollTo(0,0);if(v=="vCart")renderCart();if(v=="vPay"){$("#payTotal").textContent=egp(cartTotal());setPM()}}
document.addEventListener("click",e=>{
 const a=e.target.closest("[data-a]"),d=e.target.closest("[data-d]"),g=e.target.closest("[data-go]");
 if(a)change(a.dataset.a,1);if(d)change(d.dataset.d,-1);if(g)go(g.dataset.go);if(e.target.id=="toPay")go("vPay");
});
$("#cartBar").onclick=()=>go("vCart");
function setPM(){const m=$("input[name=pm]:checked").value;$("#payNum").textContent=m=="instapay"?settings.instapay:settings.wallet;$("#payHint").textContent=m=="instapay"?"حوّل على عنوان إنستاباي ده":"حوّل على رقم المحفظة ده";$("#copied").textContent=""}
$$("input[name=pm]").forEach(r=>r.onchange=setPM);
$("#copyNum").onclick=async()=>{try{await navigator.clipboard.writeText($("#payNum").textContent.replace(/\s/g,""));$("#copied").textContent="اتنسخ ✓"}catch(e){$("#copied").textContent="انسخه يدويًا"}};
$("#shot").onchange=e=>{const f=e.target.files[0];if(!f)return;const img=new Image();img.onload=()=>{const k=Math.min(1,1200/Math.max(img.width,img.height)),c=document.createElement("canvas");c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext("2d").drawImage(img,0,0,c.width,c.height);c.toBlob(b=>{shotBlob=b;$("#upTxt").innerHTML=`<img src="${c.toDataURL("image/jpeg",.5)}" alt="">تم ✓ (اضغط للتغيير)`},"image/jpeg",.72);URL.revokeObjectURL(img.src)};img.onerror=()=>$("#payErr").textContent="الصورة دي مش مدعومة، جرّب سكرين تاني";img.src=URL.createObjectURL(f)};
const uuid=()=>crypto.randomUUID?crypto.randomUUID():"10000000-1000-4000-8000-100000000000".replace(/[018]/g,c=>(c^crypto.getRandomValues(new Uint8Array(1))[0]&15>>c/4).toString(16));
$("#send").onclick=async()=>{
 const ph=$("#phone").value.replace(/\D/g,"");let err="";
 if(!Object.keys(cart).length)err="السلة فاضية";else if(!shotBlob)err="ارفع سكرين التحويل الأول";else if(!/^01[0125]\d{8}$/.test(ph))err="اكتب رقم موبايل مصري صح (11 رقم يبدأ بـ 01)";
 $("#payErr").textContent=err;if(err)return;
 const btn=$("#send");btn.disabled=true;btn.innerHTML='<span class="spin"></span> بنبعت الطلب…';
 try{
  const path=uuid()+".jpg";
  const up=await sb.storage.from("shots").upload(path,shotBlob,{contentType:"image/jpeg"});
  if(up.error)throw new Error("upload");
  const r=await sb.rpc("place_order",{p_table:TABLE,p_items:Object.entries(cart).map(([id,q])=>({id:+id,q})),p_method:$("input[name=pm]:checked").value,p_shot:path,p_phone:ph,p_memo:$("#memo").value});
  if(r.error)throw new Error(r.error.message);
  const o=r.data[0];ls.set("dejevu_order",{token:o.order_token,t:Date.now()});
  cart={};shotBlob=null;$("#upTxt").textContent="📷 اضغط هنا لرفع السكرين";$("#memo").value="";renderMenu();
  go("vStatus");track(o.order_token);
 }catch(e){
  const m=String(e.message||"");
  $("#payErr").textContent=m.includes("paused")?"الطلب متوقف مؤقتًا دلوقتي، اطلب من الكاشير.":m.includes("unavailable")?"في صنف في طلبك لسه خالص، شيله وجرّب تاني.":"حصلت مشكلة، اتأكد من النت وجرّب تاني.";
  if(m.includes("unavailable"))loadMenu();
 }finally{btn.disabled=false;btn.textContent="ابعت الطلب"}
};
async function track(token){
 clearTimeout(pollT);
 const r=await sb.rpc("get_order",{p_token:token});
 const o=r.data&&r.data[0];
 if(!o){$("#statusBody").innerHTML=`<p class="note">مش لاقيين الطلب.</p><button class="primary" data-go="vMenu">المنيو</button>`;return}
 if(o.status=="rejected"){$("#statusBody").innerHTML=`<div class="big" style="color:var(--bad)">!</div><h2>الطلب اترفض</h2><p>السبب: <b>${esc(o.reason||"")}</b></p><p class="note">كلّم الكاشير أو اطلب تاني.</p><button class="primary" data-go="vMenu">ارجع للمنيو</button>`;ls.set("dejevu_order",null);return}
 const k=["new","prep","ready","done"].indexOf(o.status);
 const st=["مستني الكاشير يتأكد من التحويل","اتأكد ✓ أوردرك بيتجهز","جاهز! تعالى استلمه من الكاشير","اتسلّم، بالهنا والشفا ☕"];
 $("#statusBody").innerHTML=`<p class="note">رقم الأوردر</p><div class="big">${Number(o.order_id).toLocaleString("ar-EG")}</div><p class="note">ترابيزة ${Number(o.table_no).toLocaleString("ar-EG")} · ${egp(o.total)}</p><div class="steps">${st.map((t,i)=>`<div class="st ${i<=k?"on":""} ${i==k&&k<3?"now":""}"><i>${i<k?"✓":(i+1).toLocaleString("ar-EG")}</i>${t}</div>`).join("")}</div><p class="note">الصفحة دي بتتحدث لوحدها. وهيوصلك واتساب لما يجهز.</p><button class="ghost" data-go="vMenu">اطلب حاجة تانية</button>`;
 if(k<3)pollT=setTimeout(()=>track(token),4000);else ls.set("dejevu_order",null);
}
loadMenu();
const saved=ls.get("dejevu_order");
if(saved&&saved.token&&Date.now()-saved.t<6*3600e3){go("vStatus");track(saved.token)}
}
</script>
</body>
</html>
